rules_version='2';
service cloud.firestore{match /databases/{d}/documents{
 function signedIn(){return request.auth!=null}
 function isAdmin(){return signedIn()&&get(/databases/$(d)/documents/users/$(request.auth.uid)).data.get('admin',false)==true}
 function inRide(r){return signedIn()&&(get(/databases/$(d)/documents/rides/$(r)).data.pax==request.auth.uid||get(/databases/$(d)/documents/rides/$(r)).data.driver==request.auth.uid)}
 function verifiedDriver(){return get(/databases/$(d)/documents/users/$(request.auth.uid)).data.get('dstatus','legacy') in ['verified','legacy']}
 match /users/{u}{
  allow read:if signedIn();
  allow create:if request.auth.uid==u&&!('admin' in request.resource.data);
  allow update:if (request.auth.uid==u
      &&!request.resource.data.diff(resource.data).affectedKeys().hasAny(['admin','dreviewed'])
      &&(!request.resource.data.diff(resource.data).affectedKeys().hasAny(['dstatus'])||request.resource.data.dstatus in ['pending','none']))
     ||isAdmin();
  allow delete:if request.auth.uid==u;
  match /docs/{k}{allow read:if request.auth.uid==u||isAdmin();allow write:if request.auth.uid==u;}
 }
 match /rides/{r}{
  allow read:if signedIn();
  allow create:if request.auth.uid==request.resource.data.pax;
  allow update:if signedIn()&&(request.auth.uid==resource.data.pax||request.auth.uid==resource.data.driver||resource.data.status=='open');
  match /offers/{o}{allow read:if signedIn();allow write:if request.auth.uid==o&&verifiedDriver();}
  match /msgs/{m}{
   allow read:if inRide(r);
   allow create:if inRide(r)&&request.resource.data.from==request.auth.uid;
   allow update:if inRide(r)&&resource.data.from!=request.auth.uid&&request.resource.data.diff(resource.data).affectedKeys().hasOnly(['del','read']);
   allow delete:if inRide(r);
  }
  match /calls/{c}{
   allow read,create,update:if inRide(r);
   match /ice/{i}{allow read,create:if inRide(r);}
  }
 }
}}

<style>

/* ================= ZimGo v4 renovation ================= */

async function dcancel(){

 fx(R_.doc(id).collection('offers').doc(me.uid).delete());SENT[id]=0;toast('Pickup cancelled')}

function drvIdle(){
 openU&&openU();openU=null;$('#top').hidden=true;$('#pin').hidden=true;clrMap(['me']);if(here)put('me',here,carI(lastHead,me&&me.car));
 const t0=new Date();t0.setHours(0,0,0,0);const td=HIST.filter(h=>h.created&&h.created.seconds*1000>=t0);
 sh(`<div class="row"><h3>${online?'You are online':'You are offline'}</h3><button class="btn s ${online?'d':''}" onclick="tog()">${online?'Go offline':'Go online'}</button></div>
 <div class="row" style="gap:8px"><div class="card" style="flex:1;margin:0;text-align:center"><div class="m" style="margin:0">Today</div><b class="pr">${money(td.reduce((a,h)=>a+(+h.price||0),0))}</b></div><div class="card" style="flex:1;margin:0;text-align:center"><div class="m" style="margin:0">Trips</div><b class="pr">${td.length}</b></div></div>
 <div id="reqs">${online?'<p class="m">Looking for ride requests…</p>':'<p class="m">Go online to see passengers near you.</p>'}</div>`);

}
function drawReqs(){
 const box=$('#reqs');if(!box||ride||!online)return;if(document.activeElement&&box.contains(document.activeElement))return;
 for(const k in M)if(k[0]==='r'){M[k].setMap(null);delete M[k]}
 RQ.forEach(r=>put('r'+r.id,{lat:r.pickup.lat,lng:r.pickup.lng},pickI()));
 box.innerHTML=RQ.length?RQ.map(r=>`<div class="card"><div class="row" style="margin:0"><b>${esc(r.paxName)}</b><span class="pr">${money(r.price)}</span></div>

 ${SENT[r.id]?`<p class="m"><b>Offer of ${money(SENT[r.id])} sent. Waiting for passenger…</b></p>`:`<button class="btn" onclick="offer('${r.id}',${r.price})">Accept ${money(r.price)}</button>

}
async function offer(id,p){

}

const ic=(n,s,c)=>`<svg class="ico ${c||''}" viewBox="0 0 24 24" width="${s||22}" height="${s||22}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[n]||''}</svg>`;
const icf=(n,s,c)=>ic(n,s,c).replace('fill="none"','fill="currentColor"');
const stars5=(v,s)=>`<span class="st5">${[1,2,3,4,5].map(i=>`<span class="${v>=i-.25?'on':v>=i-.75?'half':'off'}">${icf('star',s||14)}</span>`).join('')}</span>`;
const rateTxt=(r)=>r&&r.n?`${r.avg.toFixed(2)} <span class="mm">(${r.n})</span>`:'<span class="mm">New</span>';
const avt=(photo,name,sz,cls)=>{sz=sz||46;return photo?`<img class="avi ${cls||''}" style="width:${sz}px;height:${sz}px" src="${photo}" alt="">`:`<span class="avi ph ${cls||''}" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px">${esc((name||'?')[0]).toUpperCase()}</span>`};
const vbadge=()=>`<span class="vb" title="Verified driver">${ic('shieldcheck',15)}</span>`;

/* ============ SOUND / ALERTS ============ */
let _ac;function beep(){try{const P=prefs();if(!P.snd)return;_ac=_ac||new(window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.frequency.value=880;o.type='sine';g.gain.value=.06;o.connect(g);g.connect(_ac.destination);o.start();o.stop(_ac.currentTime+.18)}catch(e){}}
function alertUser(msg){toast(msg);beep();try{if(prefs().push&&document.hidden&&window.Notification&&Notification.permission==='granted')new Notification(APP.name,{body:msg,icon:'icon-192.png'})}catch(e){}}

/* ============ PHOTOS ============ */
function pickFile(capture){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';if(capture)i.setAttribute('capture',capture);i.style.display='none';document.body.appendChild(i);i.onchange=()=>{res(i.files[0]||null);i.remove()};i.click()})}
function loadImg(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>res(im);im.src=r.result};r.readAsDataURL(file)})}
async function squareJpeg(file,size,q){const im=await loadImg(file),s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2,c=document.createElement('canvas');c.width=c.height=size;c.getContext('2d').drawImage(im,sx,sy,s,s,0,0,size,size);return c.toDataURL('image/jpeg',q)}
async function fitJpeg(file,max,q){const im=await loadImg(file),k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function changePhoto(capture){
 const f=await pickFile(capture);if(!f)return;
 try{const big=await squareJpeg(f,320,.8),sm=await squareJpeg(f,96,.7);await db.collection('users').doc(me.uid).update({photo:big,photoS:sm});me.photo=big;me.photoS=sm;toast('Profile photo updated');pgRefresh()}catch(e){toast('Could not use that photo. Try another one.')}
}

/* ============ RATINGS ============ */
let MYD=null,MYP=null;
async function ratingOf(uid,as){
 const s=await R_.where(as==='driver'?'driver':'pax','==',uid).get();let sum=0,n=0,trips=0;const rev=[];
 s.forEach(d=>{const r=d.data();if(r.status==='done')trips++;const v=as==='driver'?r.rating:r.paxRating;if(v>0){sum+=v;n++;const t=as==='driver'?r.ratingNote:r.paxNote;if(t)rev.push({v,t,by:as==='driver'?r.paxName:r.driverName,at:(r.created&&r.created.seconds)||0})}});
 rev.sort((a,b)=>b.at-a.at);return{avg:n?sum/n:0,n,trips,rev:rev.slice(0,8)}}
const drvStatus=u=>(u||me).dstatus&&(u||me).dstatus!=='none'?(u||me).dstatus:(((u||me).car&&(u||me).plate&&(u||me).role==='driver')?'verified':'none');
const isVerified=u=>drvStatus(u)==='verified';
async function viewUser(uid,as){
 if(!uid)return;$('#mdp').innerHTML='<p class="m">Loading…</p>';$('#md').hidden=false;
 try{const [us,r]=await Promise.all([db.collection('users').doc(uid).get(),ratingOf(uid,as)]);const u=us.data()||{};
  const since=u.created&&u.created.seconds?new Date(u.created.seconds*1000).toLocaleDateString('en-GB',{month:'long',year:'numeric'}):'';
  $('#mdp').innerHTML=`<div class="vu">${avt(u.photo||u.photoS,u.name,92)}<h3>${esc(u.name||'User')} ${as==='driver'&&isVerified(u)?vbadge():''}</h3><div class="rr">${stars5(r.avg,18)}<b>${rateTxt(r)}</b></div>
  <div class="chips"><span class="chip">${ic('car',15)} ${r.trips} trip${r.trips===1?'':'s'}</span>${since?`<span class="chip">${ic('calendar',15)} Since ${since}</span>`:''}${as==='driver'&&isVerified(u)?`<span class="chip ok">${ic('shieldcheck',15)} Verified driver</span>`:''}</div>
  ${as==='driver'&&u.car?`<div class="card" style="width:100%;text-align:left"><div class="of">${carImg('ride',74)}<div class="t"><b>${esc(u.car)}</b><span class="m" style="margin:0"><span class="plate">${esc(u.plate||'')}</span></span></div></div></div>`:''}
  ${r.rev.length?`<div style="width:100%;text-align:left"><div class="sec" style="margin-top:6px">Recent comments</div>${r.rev.slice(0,3).map(x=>`<div class="rv">${stars5(x.v,12)}<p>${esc(x.t)}</p></div>`).join('')}</div>`:''}
  <button class="btn d" style="margin-top:10px" onclick="mdClose(null)">Close</button></div>`}catch(e){$('#mdp').innerHTML='<p class="m">Could not load this profile.</p><button class="btn d" onclick="mdClose(null)">Close</button>'}}

/* ============ PAGES (full-screen) ============ */
const PGS=[];
function pgOpen(fn,a){PGS.push([fn,a||[]]);pgRender()}
function pgBack(){PGS.pop();if(PGS.length)pgRender();else $('#pg').hidden=true}
function pgClose(){PGS.length=0;$('#pg').hidden=true;$('#dr').hidden=true}
function pgRefresh(){if(PGS.length&&!$('#pg').hidden){const y=$('#pg').scrollTop;pgRender();$('#pg').scrollTop=y}}
function pgRender(){const [fn,a]=PGS[PGS.length-1];$('#pg').hidden=false;$('#dr').hidden=true;$('#pgr').innerHTML='';fn(...a);}
function pgSet(title,html,right){$('#pgt').innerHTML=title;$('#pgb').innerHTML=html;$('#pgr').innerHTML=right||'';$('#pg').scrollTop=0}
const row=(icn,t,sub,on,right,danger)=>`<div class="lr ${danger?'dg':''}" onclick="${on}"><span class="lt">${ic(icn,20)}</span><div class="lm"><b>${t}</b>${sub?`<small>${sub}</small>`:''}</div>${right===undefined?ic('chevR',18,'ch'):right}</div>`;
const swt=(k,v)=>`<button class="sw ${v?'on':''}" onclick="event.stopPropagation();setPref('${k}',this)"></button>`;
function setPref(k,el){const P=prefs();P[k]=!P[k];lsS('ad_pref',JSON.stringify(P));el.classList.toggle('on',P[k]);if(k==='auto')auto=P.auto;
 if(k==='push'&&P.push&&window.Notification&&Notification.permission==='default')Notification.requestPermission().then(r=>{if(r!=='granted'){P.push=false;lsS('ad_pref',JSON.stringify(P));el.classList.remove('on');toast('Notifications are blocked in your browser settings.')}});
 if(k==='push'&&P.push&&!window.Notification){P.push=false;lsS('ad_pref',JSON.stringify(P));el.classList.remove('on');toast('Notifications are not supported on this device.')}}
function prefs(){try{return Object.assign({vib:true,snd:true,push:false,auto:false},JSON.parse(lsG('ad_pref')||'{}'))}catch(e){return{vib:true,snd:true,push:false,auto:false}}}

  const [a,b]=await Promise.all([R_.where('pax','==',me.uid).get(),R_.where('driver','==',me.uid).get()]);
  const clean=d=>{const x=d.data();delete x.paxPhoto;delete x.driverPhoto;return {id:d.id,...x,created:x.created&&x.created.seconds?new Date(x.created.seconds*1000).toISOString():null,dLoc:undefined}};
  out.ridesAsPassenger=a.docs.map(clean);out.ridesAsDriver=b.docs.map(clean);

async function doDelete(){
 if(ride)return toast('Finish or cancel your current ride first.');
 try{const uid=me.uid;const ds=await db.collection('users').doc(uid).collection('docs').get();await Promise.all(ds.docs.map(d=>d.ref.delete()));await db.collection('users').doc(uid).delete();await auth.currentUser.delete();pgClose();toast('Your account was deleted')}
 catch(e){if(e.code==='auth/requires-recent-login'){toast('For security, sign in again and then delete your account.');pgClose();auth.signOut()}else toast('Could not delete the account. Try again.')}}

/* ============ AUTH (updated: terms, Google, no role at sign-up) ============ */
function authReset(){mode='in';$('#su').hidden=true;$('#su').style.display='none';$('#cred').hidden=false;$('#alt').hidden=false;$('#tg').hidden=false;$('#fg').hidden=false;$('#cx').hidden=true;$('#tos').hidden=true;$('#go').textContent='Sign in';$('#tg').textContent='New here? Create account';$('#atag').textContent=AUTHSUB;$('#err').textContent=''}
function tgl(){mode=mode==='in'?'up':'in';const up=mode==='up';$('#su').hidden=!up;$('#su').style.display=up?'flex':'none';$('#tos').hidden=!up;$('#fg').hidden=up;$('#go').textContent=up?'Create account':'Sign in';$('#tg').textContent=up?'Have an account? Sign in':'New here? Create account';$('#err').textContent=''}
function showComplete(u){mode='complete';$('#auth').hidden=false;['#menu','#top','#pin','#loc'].forEach(x=>$(x).hidden=true);sh('');
 $('#su').hidden=false;$('#su').style.display='flex';$('#cred').hidden=true;$('#alt').hidden=true;$('#tg').hidden=true;$('#fg').hidden=true;$('#cx').hidden=false;$('#tos').hidden=false;
 $('#go').textContent='Continue';$('#atag').textContent='Almost done. Tell us a bit about you.';$('#err').textContent='';
 if(!$('#nm').value)$('#nm').value=u.displayName||''}
async function go(){
 const e=$('#em').value.trim(),p=$('#pw').value;$('#err').style.color='';$('#err').textContent='';
 try{
  if(mode==='in'){await auth.signInWithEmailAndPassword(e,p);return}
  const d={name:$('#nm').value.trim(),phone:$('#ph').value.trim(),role:'passenger',dstatus:'none',created:TS(),tosAt:TS(),tosV:APP.updated};
  if(!d.name||!d.phone)throw Error('Enter your name and phone number.');
  if(!$('#tosc').checked)throw Error('Please accept the Terms & Conditions and Privacy Policy to continue.');
  if(mode==='complete'){const u=auth.currentUser;sg=1;await db.collection('users').doc(u.uid).set(d);me={...d,uid:u.uid};sg=0;boot();return}
  sg=1;const c=await auth.createUserWithEmailAndPassword(e,p);
  await db.collection('users').doc(c.user.uid).set(d);me={...d,uid:c.user.uid};sg=0;boot();
 }catch(x){sg=0;$('#err').textContent=AERR[x.code]||String(x.message).replace('Firebase: ','')}
}

function boot(){
 clean();authReset();$('#auth').hidden=true;$('#menu').hidden=false;
 {const mt=zgTheme(me.theme);if(mt&&THEMES[mt]&&mt!==window._themeSel)applyTheme(mt)}
 if(me.role==='driver'&&!isVerified()){me.role='passenger';db.collection('users').doc(me.uid).update({role:'passenger'}).catch(()=>{})}
 auto=prefs().auto;MYD=null;MYP=null;lastDone=null;
 me.role==='driver'?driverUI():paxUI();
 ratingOf(me.uid,'pax').then(r=>{MYP=r}).catch(()=>{});
 if(isVerified())ratingOf(me.uid,'driver').then(r=>{MYD=r}).catch(()=>{});
}
async function switchMode(){
 if(ride&&ride.status!=='done')return toast('Finish your current trip first.');
 $('#dr').hidden=true;
 if(me.role==='driver')return setRole('passenger');
 if(isVerified())return setRole('driver');
 PGS.length=0;pgOpen(pgDriver)}
async function setRole(r){
 try{await db.collection('users').doc(me.uid).update({role:r});me.role=r;pgClose();clrMap();$('#pin').hidden=true;boot();toast(r==='driver'?'Driver mode on':'Passenger mode on')}catch(e){toast('Could not switch mode. Try again.')}}

async function pgHist(){
 pgSet('Ride history','<p class="m">Loading…</p>');
 try{const isD=me.role==='driver';const s=await R_.where(isD?'driver':'pax','==',me.uid).get();
  const a=s.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.status==='done'||r.status==='cancelled').sort((x,y)=>((y.created&&y.created.seconds)||0)-((x.created&&x.created.seconds)||0)).slice(0,60);
  const done=a.filter(r=>r.status==='done'),tot=done.reduce((n,r)=>n+(+r.price||0),0);
  pgSet('Ride history',`<div class="stat"><div><b>${done.length}</b><span>Completed</span></div><div><b>${money(tot)}</b><span>${isD?'Earned':'Spent'}</span></div><div><b>${a.length-done.length}</b><span>Cancelled</span></div></div>`+
  (a.length?a.map(r=>`<div class="card hi"><div class="of">${avt(isD?r.paxPhoto:r.driverPhoto,isD?r.paxName:r.driverName,44)}<div class="t"><b>${esc((r.drop&&r.drop.name)||'')}</b><span class="m" style="margin:0">${esc((r.pickup&&r.pickup.name)||'')}</span></div><span class="pr">${money(r.price)}</span></div>
  <div class="row" style="margin:10px 0 0"><span class="mm">${r.created?new Date(r.created.seconds*1000).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}</span>${r.status==='done'?'<span class="tg">Completed</span>':'<span class="tg x">Cancelled</span>'}${(isD?r.paxRating:r.rating)>0?`<span class="mm rr">${stars5(isD?r.paxRating:r.rating,12)}</span>`:''}</div></div>`).join(''):`<div class="empty">${ic('clock',34)}<p>No trips yet</p><small>Your completed and cancelled trips will show here.</small></div>`))
 }catch(e){pgSet('Ride history','<p class="m">Could not load history.</p>')}}

let VS=null;
const dstat=(s)=>({verified:['ok','Verified'],pending:['wn','Under review'],rejected:['bd','Needs attention'],none:['','Not started']})[s];

 <div class="sec">What you will need</div><div class="vsteps">${[['user','A clear profile photo of your face'],['idcard','Your valid driver\'s licence (number, expiry and photo)'],['car','Vehicle details and a photo of the vehicle'],['file','Vehicle registration book (and insurance if you have it)'],['camera','A quick selfie to confirm it is you']].map(([i,t])=>`<div class="vs">${ic(i,18)}<span>${t}</span></div>`).join('')}</div>
 <button class="btn" onclick="vStart()">${st==='rejected'?'Resubmit documents':'Start verification'}</button><p class="m" style="text-align:center">Takes about 5 minutes. Your documents are only seen by our review team. <a class="al" onclick="pgOpen(pgLegal,['privacy'])">Privacy Policy</a></p>`)}

 VS={step:0,d:{make:'',model:'',colour:'',year:'',plate:me.plate||'',licNo:'',licExp:'',agree:false,consent:false},img:{},photoBig:null,photoSm:null};
 PGS.length=0;pgOpen(pgVerify)}
const vset=(k,v)=>{VS.d[k]=v};
async function vPick(key,cap){
 const f=await pickFile(cap);if(!f)return;
 try{if(key==='profile'){VS.photoBig=await squareJpeg(f,320,.8);VS.photoSm=await squareJpeg(f,96,.7)}else VS.img[key]=await fitJpeg(f,1000,.72);pgRender()}catch(e){toast('Could not use that photo. Try another one.')}}

function pgVerify(){
 const s=VS.step,pct=Math.round((s+1)/VSTEPS.length*100),d=VS.d;let body='';
 if(s===0)body=`<p class="m">Passengers see this photo when you send an offer. Use a clear, front-facing photo of your face with good lighting.</p>${upl('profile','Profile photo','user')}`;
 if(s===1)body=`<p class="m">Enter the details exactly as they appear on your licence.</p>${vfield('licNo',"Licence number",'idcard','e.g. 12345678AB')}${vfield('licExp','Expiry date','calendar','','date')}${upl('licFront','Licence photo (front)','environment')}${upl('licBack','Licence photo (back)','environment',true)}`;
 if(s===2)body=`${vfield('make','Make','car','e.g. Honda')}${vfield('model','Model','car','e.g. Fit')}${vfield('colour','Colour','palette','e.g. White')}${vfield('year','Year','calendar','e.g. 2016','number','inputmode="numeric" min="1990" max="2100"')}${vfield('plate','Number plate','idcard','e.g. AEH 1234')}${upl('vehicle','Photo of the vehicle (number plate visible)','environment')}`;
 if(s===3)body=`<p class="m">Upload clear, readable photos. All four corners of the document should be visible.</p>${upl('registration','Vehicle registration book','environment')}${upl('insurance','Insurance certificate / licence disc','environment',true)}`;
 if(s===4)body=`<p class="m">Take a live selfie now so we can match your face to your licence and profile photo.</p>${upl('selfie','Selfie','user')}`;

let _rg=null;
function ringOff(){clearInterval(_rg);_rg=null}
function ringOn(kind){ringOff();
 const go=()=>{try{_ac=_ac||new(window.AudioContext||window.webkitAudioContext)();_ac.state==='suspended'&&_ac.resume();
  const t=_ac.currentTime,fs=kind==='in'?[440,480]:[425];
  fs.forEach(f=>{const o=_ac.createOscillator(),g=_ac.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(kind==='in'?.07:.04,t+.05);g.gain.setValueAtTime(kind==='in'?.07:.04,t+(kind==='in'?.9:1));g.gain.linearRampToValueAtTime(0,t+(kind==='in'?1:1.1));o.connect(g);g.connect(_ac.destination);o.start(t);o.stop(t+1.2)});
  if(kind==='in'&&navigator.vibrate)navigator.vibrate([500,250,500])}catch(e){}};
 go();_rg=setInterval(go,kind==='in'?3000:3500)}
const fmtD=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function callUI(){
 const C=CALL,el=$('#call');if(!C){el.hidden=true;el.innerHTML='';return}
 const p=C.peer,st={incoming:'Incoming voice call',calling:'Calling…',connecting:'Connecting…',active:fmtD(Math.floor((Date.now()-C.t0)/1000))}[C.state]||'';
 if(!el.dataset.k||el.dataset.k!==C.cid+C.state+C.muted+(C.slow?1:0)){
  el.dataset.k=C.cid+C.state+C.muted+(C.slow?1:0);
  el.innerHTML=`<div><div class="cav ${C.state==='active'?'':'pl'}">${avt(p.photo,p.name,132)}</div><h2>${esc(p.name)}</h2><div class="cst" id="cst">${st}</div><div class="csb">${esc(p.sub)}</div></div>
  <div style="width:100%"><div class="cbs">${C.state==='incoming'
   ?`<button class="cb rej" onclick="callDecline()"><i>${ic('phone',30)}</i>Decline</button><button class="cb ok" onclick="callAccept()"><i>${ic('phone',30)}</i>Accept</button>`
   :`<button class="cb ${C.muted?'on':''}" onclick="callMute()"><i>${ic(C.muted?'micoff':'mic',30)}</i>${C.muted?'Unmute':'Mute'}</button><button class="cb end" onclick="callHang()"><i>${ic('phone',30)}</i>End</button>`}</div>
  ${C.slow&&C.state!=='active'&&C.state!=='incoming'&&p.phone?`<a class="cph" href="tel:${esc(p.phone)}">Taking long? Use a normal phone call</a>`:''}</div>`}
 el.hidden=false;const s=$('#cst');if(s)s.textContent=st}
function callSet(s){if(!CALL)return;CALL.state=s;callUI()}
function mkPC(){const C=CALL,pc=new RTCPeerConnection({iceServers:ICE_SERVERS});C.pc=pc;C.pend=[];
 C.stream.getTracks().forEach(t=>pc.addTrack(t,C.stream));
 pc.onicecandidate=e=>{if(e.candidate)C.ref.collection('ice').add({from:me.uid,c:JSON.stringify(e.candidate)}).catch(()=>{})};
 pc.ontrack=e=>{const a=$('#rem');a.srcObject=e.streams[0];a.play().catch(()=>{})};
 pc.onconnectionstatechange=()=>{if(CALL!==C)return;const s=pc.connectionState;
  if(s==='connected')callConnected();
  else if(s==='failed'){toast("Couldn't connect the call. Try again, or use a phone call.");callEnd('ended')}
  else if(s==='disconnected'){clearTimeout(C.dt);C.dt=setTimeout(()=>{if(CALL===C&&pc.connectionState!=='connected'){toast('Call lost connection.');callEnd('ended')}},9000)}};
 return pc}
function callConnected(){const C=CALL;if(!C||C.state==='active')return;ringOff();C.t0=Date.now();clearTimeout(C.to);callSet('active');
 C.tick=setInterval(()=>{if(CALL===C){const s=$('#cst');s&&(s.textContent=fmtD(Math.floor((Date.now()-C.t0)/1000)))}},1000)}
const flushIce=()=>{const C=CALL;if(!C||!C.pc||!C.pc.remoteDescription)return;(C.pend||[]).splice(0).forEach(c=>C.pc.addIceCandidate(c).catch(()=>{}))};
function watchCall(){const C=CALL;
 C.unsub=[C.ref.onSnapshot(s=>{const d=s.data();if(!d||CALL!==C)return;
   if(C.role==='caller'&&d.answer&&C.pc&&!C.pc.remoteDescription){C.pc.setRemoteDescription(d.answer).then(flushIce).catch(()=>{});if(C.state==='calling')callSet('connecting')}
   if(['ended','declined','missed','cancelled'].includes(d.state))callCleanup(d.state,true)}),
  C.ref.collection('ice').onSnapshot(s=>{s.docChanges().forEach(c=>{if(c.type!=='added'||CALL!==C)return;const d=c.doc.data();if(d.from===me.uid)return;
   try{const cand=new RTCIceCandidate(JSON.parse(d.c));if(C.pc&&C.pc.remoteDescription)C.pc.addIceCandidate(cand).catch(()=>{});else C.pend.push(cand)}catch(e){}})})]}
async function getMic(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.RTCPeerConnection){toast('Voice calls are not supported on this browser.');return null}
 try{return await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
 catch(e){toast('Allow microphone access to make voice calls.');return null}}
async function callStart(){
 const r=ride;if(CALL)return callUI();if(!chatOK(r))return toast('You can call once a driver accepts the ride.');
 const stream=await getMic();if(!stream)return;if(CALL||!chatOK(ride)){stream.getTracks().forEach(t=>t.stop());return}
 const p=peerOf(r),ref=R_.doc(r.id).collection('calls').doc();
 CALL={rid:r.id,cid:ref.id,ref,role:'caller',peer:p,stream,state:'calling',muted:false,drv:r.driver,t0:0};
 const C=CALL;callUI();ringOn('out');
 try{const pc=mkPC();const off=await pc.createOffer();await pc.setLocalDescription(off);
  await ref.set({from:me.uid,to:p.uid,state:'ringing',offer:{type:off.type,sdp:off.sdp},ts:TS(),at:Date.now()});
  if(CALL!==C)return;watchCall();
  C.to=setTimeout(()=>{if(CALL===C&&C.state!=='active')callEnd('missed')},45000);

function callIncoming(rid,cid,d){
 if(CALL||!d||d.from===me.uid)return;
 const age=Date.now()-(d.ts&&d.ts.toMillis?d.ts.toMillis():d.at||0);if(age>90000)return;

 const ref=R_.doc(rid).collection('calls').doc(cid);
 CALL={rid,cid,ref,role:'callee',peer:peerOf(ride),offer:d.offer,state:'incoming',muted:false,drv:ride.driver,t0:0,pend:[]};
 const C=CALL;C.unsub=[ref.onSnapshot(s=>{const x=s.data();if(CALL!==C||!x)return;if(['ended','declined','missed','cancelled'].includes(x.state))callCleanup(x.state,true)})];
 callUI();ringOn('in');alertUser('📞 Incoming voice call from '+C.peer.name.split(' ')[0]);
 C.to=setTimeout(()=>{if(CALL===C&&C.state==='incoming')callCleanup('missed',true)},45000)}

 const stream=await getMic();if(CALL!==C){stream&&stream.getTracks().forEach(t=>t.stop());return}
 if(!stream)return callDecline();
 C.stream=stream;callSet('connecting');C.sl=setTimeout(()=>{if(CALL===C&&C.state!=='active'){C.slow=true;callUI()}},12000);
 try{const pc=mkPC();await pc.setRemoteDescription(C.offer);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);
  C.unsub.forEach(u=>u());watchCall();
  await C.ref.update({state:'active',answer:{type:ans.type,sdp:ans.sdp}});flushIce()}
 catch(e){toast("Couldn't answer the call.");callEnd('ended')}}

 (C.unsub||[]).forEach(u=>{try{u()}catch(e){}});

  if(moved<8){if(!hTap){SH.style.transition='';SH.style.transform='';return}col=!isMin()}else{const v=dy/Math.max(1,Date.now()-t0);col=v>.35?true:v<-.35?false:o>minOff()/2}

 if(map&&map.getZoom)map.setZoom(Math.max(3,Math.min(20,Math.round(map.getZoom())+d)))}
{const z=document.getElementById('zm'),sh=document.getElementById('sheet'),lc=document.getElementById('loc');
 const place=()=>{if(!z)return;z.hidden=!!(lc&&lc.hidden);const t=sh?sh.getBoundingClientRect().top:innerHeight*.6;z.style.bottom=Math.max(14,innerHeight-t+14)+'px'};
 place();setInterval(place,250);addEventListener('resize',place)}
{const m=document.getElementById('map');let lastEnd=0,lx=0,ly=0,mode=0,y0=0,z0=0,moved=0;
 if(m){m.addEventListener('touchstart',e=>{if(e.touches.length!==1||EMB||!map||!map.getZoom){mode=0;return}const t=e.touches[0];
   if(Date.now()-lastEnd<320&&Math.hypot(t.clientX-lx,t.clientY-ly)<50){mode=1;y0=t.clientY;z0=map.getZoom();moved=0;e.preventDefault();e.stopPropagation()}else mode=0},{capture:true,passive:false});
  m.addEventListener('touchmove',e=>{if(mode!==1)return;e.preventDefault();e.stopPropagation();const dy=y0-e.touches[0].clientY;moved=Math.max(moved,Math.abs(dy));map.setZoom(Math.max(3,Math.min(20,Math.round(z0+dy/70))))},{capture:true,passive:false});
  m.addEventListener('touchend',e=>{const t=e.changedTouches[0];if(mode===1){e.preventDefault();e.stopPropagation();if(moved<10)zoomBy(1);mode=0;lastEnd=0;return}lastEnd=Date.now();lx=t.clientX;ly=t.clientY},{capture:true,passive:false})}}

function zgDark(){try{const h=(getComputedStyle(document.documentElement).getPropertyValue('--bg0')||'#000').trim().replace('#','');const n=parseInt(h.length===3?h.replace(/./g,'$&$&'):h,16);return(((n>>16)&255)*.3+((n>>8)&255)*.59+(n&255)*.11)<110}catch(e){return false}}
function applyLayer(hy){const b=document.getElementById('ml');b&&b.classList.toggle('on',!!hy);
 if(EMB){emb.t=hy?'h':'';const c=emb.c||{lat:-17.8292,lng:31.0522};embShow(`https://www.google.com/maps?q=${c.lat},${c.lng}&z=${emb.z||16}${emb.t?'&t='+emb.t:''}&output=embed`);return}
 if(!map||!map.setMapTypeId)return;map.setMapTypeId(hy?'hybrid':'roadmap')}

const PASS=[['Harare',-17.8292,31.0522],['Bulawayo',-20.1325,28.6265],['Mutare',-18.9707,32.6709],['Gweru',-19.45,29.8167],['Masvingo',-20.0744,30.8328],['Victoria Falls',-17.9243,25.8572],['Kariba',-16.5167,28.8],['Chinhoyi',-17.3667,30.2],['Bindura',-17.3019,31.3306],['Kwekwe',-18.9281,29.8149],['Marondera',-18.1853,31.5519],['Beitbridge',-22.2167,30],['Kadoma',-18.3333,29.9167],['Rusape',-18.5333,32.1333],['Chiredzi',-21.05,31.6667],['Hwange',-18.3667,26.5],['Karoi',-16.8167,29.6833],['Chipinge',-20.1883,32.6236],['Nyanga',-18.2167,32.75],['Zvishavane',-20.3333,30.0333],['Plumtree',-20.4833,27.8167],['Gokwe',-18.2167,28.9333]];
const kmB=(a,b,c,d)=>{const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(h))};
function passCalc(d){const seen=new Map();d.forEach(r=>[r.drop,r.pickup].forEach(p=>{if(!p||p.lat==null)return;PASS.forEach(c=>{if(kmB(+p.lat,+p.lng,c[1],c[2])<22)seen.set(c[0],(seen.get(c[0])||0)+1)})}));
 const n=d.length,km=d.reduce((a,r)=>a+(+r.km||0),0),lv=n>=25?['Zim Legend','🏆']:n>=10?['Road Explorer','🧭']:n>=3?['Road Regular','🚗']:['New Traveller','🌱'];return{seen,n,km,lv}}
async function pgPass(){pgSet('ZimGo Passport','<p class="m" style="padding:14px">Loading…</p>');
 try{const s=await R_.where('pax','==',me.uid).get(),d=s.docs.map(x=>x.data()).filter(r=>r.status==='done'),P=passCalc(d);window._pp=P;
  pgSet('ZimGo Passport',`<div class="pp"><div class="ppl">${P.lv[1]}</div><b>${P.lv[0]}</b><small>${P.n} trip${P.n==1?'':'s'} · ${Math.round(P.km)} km · ${P.seen.size}/${PASS.length} towns</small><div class="ppb"><i style="width:${P.seen.size/PASS.length*100}%"></i></div></div>
  <div class="stg">${PASS.map(c=>{const k=P.seen.get(c[0]);return`<div class="stp ${k?'on':''}"><span>${k?'✓':c[0][0]}</span><b>${c[0]}</b><small>${k?k+' trip'+(k>1?'s':''):'Not yet'}</small></div>`}).join('')}</div>
  <button class="btn" onclick="passShare()">${ic('share',18)} Share my passport</button><p class="m" style="padding:10px 4px">Ride to a town to earn its stamp. Every completed trip counts.</p>`)}catch(e){pgSet('ZimGo Passport','<p class="m" style="padding:14px">Could not load your passport.</p>')}}
function passShare(){const P=window._pp;if(!P)return;const t=`🇿🇼 My ZimGo Passport\n${P.lv[1]} ${P.lv[0]} · ${P.n} trips · ${Math.round(P.km)} km\nTowns stamped (${P.seen.size}/${PASS.length}): ${[...P.seen.keys()].join(', ')||'none yet'}\nName your fare. Ride anywhere. Join me on ZimGo!`;window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}
const _om3=openMenu;openMenu=function(){_om3();const d=$('#drp .dl');if(d&&me.role!=='driver'&&!d.querySelector('[data-pass]')){const a=d.querySelector('[data-msg]')||d.children[1];a&&a.insertAdjacentHTML('afterend',dli('globe','ZimGo Passport',"PGS.length=0;pgOpen(pgPass)").replace('<div ','<div data-pass '))}};

function voiceDest(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voice search is not supported on this phone.');const b=document.getElementById('vmic'),r=new R();r.lang='en-GB';r.interimResults=false;r.maxAlternatives=1;b.classList.add('on');
 r.onresult=e=>{const t=e.results[0][0].transcript.replace(/^(please )?(take me to|go to|i want to go to|to)\s+/i,'').trim();const i=document.getElementById('sds');i.value=t;sf='ds';query(t,'ds')};r.onerror=()=>toast('Could not hear you. Try again.');r.onend=()=>b.classList.remove('on');try{r.start()}catch(e){b.classList.remove('on')}}
